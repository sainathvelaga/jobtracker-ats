server {
  listen 80;
  server_name _;

  # Serve static files (Angular built output)
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API endpoints to backend service by service name (docker-compose network)
  location /auth/ {
    proxy_pass http://backend:8080/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /applications/ {
    proxy_pass http://backend:8080/applications/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /ats/ {
    proxy_pass http://backend:8080/ats/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /jobs/ {
    proxy_pass http://backend:8080/jobs/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Swagger / OpenAPI proxy so UI remains accessible from frontend host
  location /v3/api-docs/ {
    proxy_pass http://backend:8080/v3/api-docs/;
  }
  location /swagger-ui.html {
    proxy_pass http://backend:8080/swagger-ui.html;
  }
}
