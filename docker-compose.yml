version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: jobtracker-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobtracker-backend
    environment:
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: jobtracker
      APP_JWT_SECRET: change-me-to-a-secure-random-key
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      # mount a custom nginx config to ensure API paths are proxied to the backend
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mongo-data:
