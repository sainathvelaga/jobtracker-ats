server:
  port: 8080

spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: jobtracker

app:
  jwt:
    secret: change-me-to-a-secure-random-key
    expirationMs: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
